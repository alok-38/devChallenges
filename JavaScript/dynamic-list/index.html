<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>How to avoid manually creating new list using JavaScript?</title>
  </head>
  <body>
    <script>
      // Generate an array with Array.from()
      const list = Array.from({ length: 5 }, (_, i) => i + 1);
      console.log(list);
      // Create a list from existing data
      const names = ["Alice", "Bob", "Charlie"];
      const upperNames = names.map((name) => name.toUpperCase());
      console.log(upperNames);
    </script>
  </body>
</html>
